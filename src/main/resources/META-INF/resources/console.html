<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Response console</title>
<link rel="stylesheet" href="/assets/brand.css">
<link rel="stylesheet" href="/assets/console.css">
<script type="module" src="/assets/console.js"></script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="/">Incident<br><span class="grad-text">Response</span></a>
    <span class="grad-bar"></span>
    <div class="conn"><span id="conn-dot" class="conn-dot" data-state="off"></span><span id="conn-text">connecting…</span></div>
    <nav id="rail-scenarios" class="rail-scenarios" aria-label="Scenarios"></nav>
    <nav class="rail-foot" aria-label="Links">
      <a href="/talks/slides/agentic-workflows-com-quarkus-flow-e-langchain4j.html">Slides</a>
      <a href="/q/swagger-ui">Swagger</a>
      <a href="/q/dev-ui">Dev UI</a>
    </nav>
  </aside>

  <main class="main">
    <section id="stage" class="stage" aria-live="polite"></section>

    <section class="runs-section" aria-label="Runs">
      <div class="runs-head">
        <h2>Runs</h2>
        <button id="clear-runs" class="btn btn-ghost" type="button">Clear finished</button>
      </div>
      <div id="runs" class="runs">
        <p id="runs-empty" class="runs-empty">No runs yet. Pick a scenario and run it; results land here, newest first.</p>
      </div>
    </section>
  </main>
</div>
</body>
</html>
