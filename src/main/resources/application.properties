# ===================== Chat models =====================
# Default provider: NVIDIA NIM (OpenAI-compatible). No token cap, 40 RPM limit.
# API key is read from the environment, never hardcoded.
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.base-url=https://integrate.api.nvidia.com/v1
quarkus.langchain4j.openai.api-key=${NVIDIA_AI_API_KEY:dummy}
quarkus.langchain4j.openai.chat-model.model-name=meta/llama-3.2-11b-vision-instruct
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=120s
# Built-in client retry (transient errors / 429). Deeper backoff is added via @ErrorHandler.
quarkus.langchain4j.openai.max-retries=3

# Evidence model (@ModelName("evidence")): the 3 @ParallelAgent evidence agents and the supervisor's
# specialists. The evidence agents call @Tools (ObservabilityTools), so this model must be reliable at
# tool calling: llama-3.2-11b answered with fake tool calls as plain text, Nemotron 3 Super calls the
# tools and is faster. Plain-text output (no JSON schema needed).
quarkus.langchain4j.evidence.chat-model.provider=openai
quarkus.langchain4j.openai.evidence.base-url=https://integrate.api.nvidia.com/v1
quarkus.langchain4j.openai.evidence.api-key=${NVIDIA_AI_API_KEY:dummy}
quarkus.langchain4j.openai.evidence.chat-model.model-name=nvidia/nemotron-3-super-120b-a12b
quarkus.langchain4j.openai.evidence.chat-model.temperature=0
quarkus.langchain4j.openai.evidence.timeout=120s
quarkus.langchain4j.openai.evidence.max-retries=3
quarkus.langchain4j.openai.evidence.log-requests=true
quarkus.langchain4j.openai.evidence.log-responses=true

# ---- Offline fallback: Ollama (run with: quarkus dev -Dquarkus.profile=ollama,dev) ----
# Dev Services auto-starts Ollama and pulls the models. Big+small split mirrored locally.
%ollama.quarkus.langchain4j.chat-model.provider=ollama
%ollama.quarkus.langchain4j.ollama.chat-model.model-id=qwen3.5:2b
%ollama.quarkus.langchain4j.ollama.chat-model.temperature=0.0
%ollama.quarkus.langchain4j.ollama.chat-model.format=json
%ollama.quarkus.langchain4j.ollama.chat-model.model-options.think=false
%ollama.quarkus.langchain4j.ollama.timeout=120s
%ollama.quarkus.langchain4j.evidence.chat-model.provider=ollama
%ollama.quarkus.langchain4j.ollama.evidence.chat-model.model-id=qwen3.5:0.8b
%ollama.quarkus.langchain4j.ollama.evidence.chat-model.model-options.think=false
%ollama.quarkus.langchain4j.ollama.evidence.timeout=120s

# ---- Tests: same NVIDIA NIM models as dev. The default suite mocks every LLM; only the real-llm
# tests (-Preal-llm) call NVIDIA and need NVIDIA_AI_API_KEY. On CPU-only Ollama they took 20+ minutes.
%test.quarkus.langchain4j.openai.log-requests=false
%test.quarkus.langchain4j.openai.evidence.log-requests=false
%test.quarkus.langchain4j.openai.evidence.log-responses=false

# PostgreSQL - Dev Services auto-starts container in dev/test
quarkus.datasource.db-kind=postgresql
# 'update' (not drop-and-create) so Incident/Alert rows survive a hot reload / restart,
# letting the durable HITL workflow (restored from MVStore by autoRestore) be approved
# after a restart. Dev Services Postgres is reused (testcontainers.reuse.enable=true).
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.datasource.devservices.reuse=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Flow persistence - MVStore (file-based, survives restarts).
# NOTE: quarkus-flow-jpa is unusable here because its JpaPersistenceExecutor.execute(...)
# is @Transactional and runs the JTA tx on the calling thread; workflow tasks that complete
# on a Vert.x event-loop thread (the Kafka emitJson approval-request) then crash with
# "@Transactional cannot start a JTA transaction within a reactive pipeline". MVStore uses
# the default non-transactional AsyncPersistenceExecutor, which persists off the event loop.
# The Layer 2 agentic pipeline is AOT-compiled by quarkus-flow-langchain4j into Flow
# workflows. Their AgenticScope-backed state has no CustomObjectMarshaller for
# AgenticAwareWorkflowModel, so they must run in-memory (excluded from persistence).
# Only the Layer 3 'incident-response' Flow is persisted (it needs durability for HITL).
# Listed in pipeline topology order. Format: namespace:name:version (no wildcards supported).
quarkus.flow.persistence.mvstore.db-path=${user.home}/incident-response-sre-flow.mv.db
%test.quarkus.flow.persistence.mvstore.db-path=${java.io.tmpdir}/incident-response-sre-test-flow.mv.db
quarkus.flow.persistence.exclude-workflows=\
  com.acme.sre.ai.diagnostics:severity-classifier:0.0.1,\
  com.acme.sre.ai.diagnostics:severity-router:0.0.1,\
  com.acme.sre.ai.diagnostics:deep-diagnosis-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:evidence-gatherer:0.0.1,\
  com.acme.sre.ai.diagnostics:logs-analysis-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:metrics-analysis-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:deploy-history-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:diagnostic-loop-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:diagnostic-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:remediation-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:confidence-scorer:0.0.1,\
  com.acme.sre.ai.diagnostics:light-triage-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:light-diagnosis-agent:0.0.1,\
  com.acme.sre.ai.diagnostics:light-remediation-agent:0.0.1

# Flow Dev UI
quarkus.flow.devui.backend.storage.enabled=true

# Flow tracing
quarkus.flow.tracing.enabled=true

# Flow messaging - CloudEvents via Kafka
quarkus.flow.messaging.defaults-enabled=true
# Publish per-task lifecycle events (workflow/task started/completed) for live progress in the dashboard
quarkus.flow.messaging.lifecycle-enabled=true

# Kafka Dev Services (auto-starts a Kafka container in dev/test)
# Pre-create the topics: consumers use auto.offset.reset=latest, so on a fresh broker the message
# that auto-creates a topic lands before the consumer's first offset and is silently skipped
# (the first HITL approval of every run was lost and the workflow never resumed).
quarkus.kafka.devservices.topic-partitions.flow-in=1
quarkus.kafka.devservices.topic-partitions.flow-out=1
quarkus.kafka.devservices.topic-partitions.flow-lifecycle-out=1
mp.messaging.incoming.flow-in.connector=smallrye-kafka
mp.messaging.incoming.flow-in.topic=flow-in
mp.messaging.incoming.flow-in.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.flow-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.flow-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-out.topic=flow-out
mp.messaging.outgoing.flow-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Dashboard consumes workflow output events (flow-out) for live updates via WebSocket
mp.messaging.incoming.flow-out-incoming.connector=smallrye-kafka
mp.messaging.incoming.flow-out-incoming.topic=flow-out
mp.messaging.incoming.flow-out-incoming.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-out-incoming.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-out-incoming.auto.offset.reset=latest
# The dashboard consumers broadcast to this instance's WebSocket clients, so every instance needs
# every event: one consumer group per instance. A shared group hands the single partition to only
# one instance (Dev Services shares the broker across local instances and test runs), and the
# others' consoles stop receiving events. flow-in keeps the shared group: it is the engine's queue.
mp.messaging.incoming.flow-out-incoming.group.id=incident-dashboard-${quarkus.uuid}

# Lifecycle events publisher channel (Flow -> Kafka) and the dashboard consumer (Kafka -> WebSocket)
mp.messaging.outgoing.flow-lifecycle-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-lifecycle-out.topic=flow-lifecycle-out
mp.messaging.outgoing.flow-lifecycle-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-lifecycle-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.flow-lifecycle-incoming.connector=smallrye-kafka
mp.messaging.incoming.flow-lifecycle-incoming.topic=flow-lifecycle-out
mp.messaging.incoming.flow-lifecycle-incoming.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-lifecycle-incoming.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-lifecycle-incoming.auto.offset.reset=latest
mp.messaging.incoming.flow-lifecycle-incoming.group.id=incident-dashboard-${quarkus.uuid}

# Approval/HITL events are published back into the workflow ingestion topic (flow-in)
mp.messaging.outgoing.flow-in-outgoing.connector=smallrye-kafka
mp.messaging.outgoing.flow-in-outgoing.topic=flow-in
mp.messaging.outgoing.flow-in-outgoing.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.outgoing.flow-in-outgoing.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# External integrations - stubbed by the WireMock dev service (dev + test only).
# Stub mappings live in src/test/resources/mappings (+ __files); visible in Dev UI.
quarkus.wiremock.devservices.enabled=true
quarkus.wiremock.devservices.port=8089
quarkus.wiremock.devservices.files-mapping=src/test/resources

monitoring-api.prometheus.url=http://localhost:8089/prometheus/query
deployment-api.url=http://localhost:8089/deployment/remediate
slack-webhook.url=http://localhost:8089/slack/notify
# Observability REST client used by the evidence agents' @Tools (metrics, logs, deployments).
quarkus.rest-client.observability-api.url=http://localhost:8089
quarkus.rest-client.observability-api.connect-timeout=2000
quarkus.rest-client.observability-api.read-timeout=5000

# Tests get their own WireMock port so they can run (continuous testing) while the dev app holds 8089.
%test.quarkus.wiremock.devservices.port=8189
%test.monitoring-api.prometheus.url=http://localhost:8189/prometheus/query
%test.deployment-api.url=http://localhost:8189/deployment/remediate
%test.slack-webhook.url=http://localhost:8189/slack/notify
%test.quarkus.rest-client.observability-api.url=http://localhost:8189

# HITL configuration
incident.remediation.destructive-requires-approval=true

# Debug logging for agentic/Flow tracing
quarkus.log.category."dev.langchain4j.agentic".level=DEBUG
quarkus.log.category."io.quarkiverse.flow.langchain4j".level=DEBUG
quarkus.log.category."dev.langchain4j.service".level=DEBUG
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG
