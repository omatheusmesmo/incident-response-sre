# LangChain4j - Default provider: Ollama
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.ollama.chat-model.model-id=qwen3.5:2b
quarkus.langchain4j.ollama.chat-model.temperature=0.0
quarkus.langchain4j.ollama.chat-model.format=json
quarkus.langchain4j.ollama.chat-model.model-options.think=false
quarkus.langchain4j.ollama.log-requests=true
quarkus.langchain4j.ollama.log-responses=true

%test.quarkus.langchain4j.ollama.chat-model.model-id=qwen3.5:0.8b

# Ollama timeout (default 10s is too short for local models)
quarkus.langchain4j.ollama.timeout=600s
%test.quarkus.langchain4j.ollama.timeout=600s

# Alternative: OpenAI (uncomment to use)
# quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
# quarkus.langchain4j.openai.chat-model.model-name=gpt-4o
# quarkus.langchain4j.openai.chat-model.temperature=0.0

# PostgreSQL - Dev Services auto-starts container in dev/test
quarkus.datasource.db-kind=postgresql
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Flow persistence - JPA (PostgreSQL-backed, durable)
# Exclude auto-registered LC4J agentic workflows from persistence
# (they lack CustomObjectMarshaller for AgenticAwareWorkflowModel)
quarkus.flow.persistence.exclude-workflows=com.acme.sre.ai:incident-response-agent:0.0.1,com.acme.sre.ai:diagnostic-loop-agent:0.0.1,com.acme.sre.ai:severity-classifier:0.0.1,com.acme.sre.ai:diagnostic-agent:0.0.1,com.acme.sre.ai:remediation-agent:0.0.1,com.acme.sre.ai:confidence-scorer:0.0.1,com.acme.sre.ai:post-incident-agent:0.0.1

# Flow Dev UI
quarkus.flow.devui.backend.storage.enabled=true

# Flow tracing
quarkus.flow.tracing.enabled=true

# Flow messaging - CloudEvents via Kafka
quarkus.flow.messaging.defaults-enabled=true
# Publish per-task lifecycle events (workflow/task started/completed) for live progress in the dashboard
quarkus.flow.messaging.lifecycle-enabled=true

# Kafka Dev Services (auto-starts Redpanda container in dev/test)
mp.messaging.incoming.flow-in.connector=smallrye-kafka
mp.messaging.incoming.flow-in.topic=flow-in
mp.messaging.incoming.flow-in.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.flow-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.flow-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-out.topic=flow-out
mp.messaging.outgoing.flow-out.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.outgoing.flow-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Dashboard consumes workflow output events (flow-out) for live updates via WebSocket
mp.messaging.incoming.flow-out-incoming.connector=smallrye-kafka
mp.messaging.incoming.flow-out-incoming.topic=flow-out
mp.messaging.incoming.flow-out-incoming.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.flow-out-incoming.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-out-incoming.auto.offset.reset=latest

# Lifecycle events publisher channel (Flow -> Kafka) and the dashboard consumer (Kafka -> WebSocket)
mp.messaging.outgoing.flow-lifecycle-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-lifecycle-out.topic=flow-lifecycle-out
mp.messaging.outgoing.flow-lifecycle-out.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.outgoing.flow-lifecycle-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.flow-lifecycle-incoming.connector=smallrye-kafka
mp.messaging.incoming.flow-lifecycle-incoming.topic=flow-lifecycle-out
mp.messaging.incoming.flow-lifecycle-incoming.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.flow-lifecycle-incoming.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-lifecycle-incoming.auto.offset.reset=latest

# Approval/HITL events are published back into the workflow ingestion topic (flow-in)
mp.messaging.outgoing.flow-in-outgoing.connector=smallrye-kafka
mp.messaging.outgoing.flow-in-outgoing.topic=flow-in
mp.messaging.outgoing.flow-in-outgoing.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.outgoing.flow-in-outgoing.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Mock infrastructure URLs
monitoring-api.prometheus.url=http://localhost:8080/mock/prometheus/query
deployment-api.url=http://localhost:8080/mock/deployment/remediate
slack-webhook.url=http://localhost:8080/mock/slack/notify

# HITL configuration
incident.remediation.destructive-requires-approval=true

# Debug logging for agentic/Flow tracing
quarkus.log.category."dev.langchain4j.agentic".level=DEBUG
quarkus.log.category."io.quarkiverse.flow.langchain4j".level=DEBUG
quarkus.log.category."dev.langchain4j.service".level=DEBUG
